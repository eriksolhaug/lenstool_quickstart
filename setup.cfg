# Code style and linting configuration for black
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

# Import sorting with isort
[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]

# Coverage configuration
[tool.coverage.run]
branch = true
source = ["lenstool_quickstart"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
